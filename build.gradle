import groovy.json.JsonSlurper

plugins { id 'base' }
ext.minecraftVersion = providers.gradleProperty('minecraft_version').getOrElse('26.3')
ext.targetLoader = providers.gradleProperty('loader').getOrElse('fabric')
def matrix = new JsonSlurper().parse(file('versions.json'))
if (!matrix.containsKey(minecraftVersion)) throw new GradleException("Unsupported Minecraft ${minecraftVersion}; use build_versions.py --list")
ext.targetConfig = matrix[minecraftVersion]
allprojects {
    group = 'com.tpexcotblu.litematicgen'
    version = '2.0.0-dev'
    repositories { mavenCentral() }
}
subprojects {
    layout.buildDirectory = rootProject.layout.buildDirectory.dir(name == 'core' ? 'core' : "targets/${rootProject.targetLoader}/${rootProject.minecraftVersion}")
    apply plugin: 'java'
    java { toolchain.languageVersion = JavaLanguageVersion.of(25); withSourcesJar() }
    tasks.withType(JavaCompile).configureEach { options.encoding = 'UTF-8' }
}
tasks.named('build') { dependsOn ':core:build', ':platform:build' }
tasks.named('clean') { dependsOn ':core:clean', ':platform:clean' }

tasks.register('copyJarAfterBuild', Copy) {
    dependsOn ':platform:build'
    onlyIf { project.hasProperty('modsDir') }
    from(project(':platform').layout.buildDirectory.dir('libs')) { exclude '*-sources.jar' }
    into(providers.gradleProperty('modsDir').orElse(layout.buildDirectory.dir('local-mods').map { it.asFile.path }))
}
