name: build
on: [pull_request, push]

jobs:
  plan:
    runs-on: ubuntu-24.04
    outputs:
      matrix: ${{ steps.matrix.outputs.matrix }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          java-version: '25'
          distribution: temurin
      - name: Core and planner tests
        run: python -m unittest discover -s tests -v
      - id: matrix
        name: Read stable build matrix
        shell: python {0}
        run: |
          import json, os
          versions = json.load(open('versions.json'))
          include = [{'minecraft': mc, 'loader': loader}
                     for mc, cfg in reversed(list(versions.items())) if cfg['type'] == 'release'
                     for loader in ['fabric', 'neoforge', 'quilt']]
          with open(os.environ['GITHUB_OUTPUT'], 'a') as output:
              output.write('matrix=' + json.dumps({'include': include}) + '\n')
  build:
    needs: plan
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      max-parallel: 3
      matrix: ${{ fromJson(needs.plan.outputs.matrix) }}
    steps:
      - uses: actions/checkout@v4
      - uses: gradle/actions/wrapper-validation@v4
      - uses: actions/setup-java@v4
        with:
          java-version: '25'
          distribution: temurin
      - uses: gradle/actions/setup-gradle@v4
      - name: Build selected target
        run: python build_versions.py '${{ matrix.minecraft }}' --loaders '${{ matrix.loader }}'
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: litematic-generator-${{ matrix.loader }}-${{ matrix.minecraft }}
          path: builds/
